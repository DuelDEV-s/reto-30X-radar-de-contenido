name: radar-30x
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_local_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar_local_change_me}@db:5432/${POSTGRES_DB:-radar}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      APP_PIN: ${APP_PIN:-}
      BRIGHT_DATA_API_KEY: ${BRIGHT_DATA_API_KEY:-}
      BRIGHT_DATA_SERP_ZONE: ${BRIGHT_DATA_SERP_ZONE:-}
      BRIGHT_DATA_INSTAGRAM_DATASET_ID: ${BRIGHT_DATA_INSTAGRAM_DATASET_ID:-}
      BRIGHT_DATA_YOUTUBE_DATASET_ID: ${BRIGHT_DATA_YOUTUBE_DATASET_ID:-}
      BRIGHT_DATA_LINKEDIN_COMPANIES_DATASET_ID: ${BRIGHT_DATA_LINKEDIN_COMPANIES_DATASET_ID:-}
      BRIGHT_DATA_INSTAGRAM_REELS_DATASET_ID: ${BRIGHT_DATA_INSTAGRAM_REELS_DATASET_ID:-}
      BRIGHT_DATA_MAX_NEW_JOBS_PER_ANALYSIS: ${BRIGHT_DATA_MAX_NEW_JOBS_PER_ANALYSIS:-4}
      BRIGHT_DATA_JOB_TIMEOUT_SECONDS: ${BRIGHT_DATA_JOB_TIMEOUT_SECONDS:-600}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_ANALYTICS_APPROVED: ${YOUTUBE_ANALYTICS_APPROVED:-false}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-6-luna}
      OPENAI_REVIEW_EFFORT: ${OPENAI_REVIEW_EFFORT:-low}
      # Radar de tendencias LinkedIn + YouTube (app/trends): solo APIs oficiales.
      EXA_API_KEY: ${EXA_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RADAR_LLM: ${RADAR_LLM:-}
      RADAR_TOP_MODEL: ${RADAR_TOP_MODEL:-sonnet}
      RUN_BUDGET_USD: ${RUN_BUDGET_USD:-6}
      TRENDS_SNAPSHOT_HOURS: ${TRENDS_SNAPSHOT_HOURS:-6}
      TRENDS_DB_PATH: /data/trends.db
      BRIGHT_DATA_INSTAGRAM_POSTS_DATASET_ID: ${BRIGHT_DATA_INSTAGRAM_POSTS_DATASET_ID:-}
      BRIGHT_DATA_MAX_POST_CREATORS: ${BRIGHT_DATA_MAX_POST_CREATORS:-15}
      INSTAGRAM_POSTS_TTL_HOURS: ${INSTAGRAM_POSTS_TTL_HOURS:-24}
      INSTAGRAM_MIN_FOLLOWERS: ${INSTAGRAM_MIN_FOLLOWERS:-2000}
      # Búsqueda de creadores de TikTok (Bright Data). Los IDs vacíos usan los scrapers publicados.
      BRIGHT_DATA_TIKTOK_POSTS_DATASET_ID: ${BRIGHT_DATA_TIKTOK_POSTS_DATASET_ID:-}
      BRIGHT_DATA_TIKTOK_PROFILES_DATASET_ID: ${BRIGHT_DATA_TIKTOK_PROFILES_DATASET_ID:-}
      TIKTOK_VIDEOS_PER_KEYWORD: ${TIKTOK_VIDEOS_PER_KEYWORD:-20}
      TIKTOK_MAX_CANDIDATES: ${TIKTOK_MAX_CANDIDATES:-20}
      TIKTOK_SEARCH_TIMEOUT_SECONDS: ${TIKTOK_SEARCH_TIMEOUT_SECONDS:-2700}
      TIKTOK_POSTS_TIMEOUT_SECONDS: ${TIKTOK_POSTS_TIMEOUT_SECONDS:-2700}
      TIKTOK_MAX_VIDEO_AGE_DAYS: ${TIKTOK_MAX_VIDEO_AGE_DAYS:-180}
      TIKTOK_MIN_FOLLOWERS: ${TIKTOK_MIN_FOLLOWERS:-5000}
      TIKTOK_PROFILE_TTL_DAYS: ${TIKTOK_PROFILE_TTL_DAYS:-30}
      TIKTOK_POSTS_TTL_HOURS: ${TIKTOK_POSTS_TTL_HOURS:-24}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      TRANSCRIPT_MAX_SECONDS: ${TRANSCRIPT_MAX_SECONDS:-30}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      CONTENT_TOP_REELS: ${CONTENT_TOP_REELS:-5}
      CONTENT_CLIP_SECONDS: ${CONTENT_CLIP_SECONDS:-10}
      CONTENT_CONTROL_REELS: ${CONTENT_CONTROL_REELS:-0}
    volumes:
      - trends_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  trends_data:
