name: radar-30x
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_local_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar_local_change_me}@db:5432/${POSTGRES_DB:-radar}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      BRIGHT_DATA_API_KEY: ${BRIGHT_DATA_API_KEY:-}
      BRIGHT_DATA_INSTAGRAM_DATASET_ID: ${BRIGHT_DATA_INSTAGRAM_DATASET_ID:-}
      BRIGHT_DATA_YOUTUBE_DATASET_ID: ${BRIGHT_DATA_YOUTUBE_DATASET_ID:-}
      BRIGHT_DATA_MAX_NEW_JOBS_PER_ANALYSIS: ${BRIGHT_DATA_MAX_NEW_JOBS_PER_ANALYSIS:-4}
      BRIGHT_DATA_JOB_TIMEOUT_SECONDS: ${BRIGHT_DATA_JOB_TIMEOUT_SECONDS:-600}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_ANALYTICS_APPROVED: ${YOUTUBE_ANALYTICS_APPROVED:-false}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
