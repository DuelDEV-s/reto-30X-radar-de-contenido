# Intentos de PIN por IP: frena la fuerza bruta cuando la app está publicada (10 por minuto, ráfaga de 5).
limit_req_zone $binary_remote_addr zone=pin_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    location = /api/auth/login {
        limit_req zone=pin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
